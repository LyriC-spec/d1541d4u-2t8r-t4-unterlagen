[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:xvfb]
; -nolisten local: kein abstrakter Socket, der im Host-Netz fuer alle lokalen
; Prozesse erreichbar waere. Der Socket unter /tmp/.X11-unix bleibt im Container.
command=/usr/bin/Xvfb :1 -screen 0 1600x1200x24 -nolisten tcp -nolisten local -dpi 96
user=konsole
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:openbox]
command=/usr/bin/openbox
environment=DISPLAY=":1",HOME="/home/konsole"
user=konsole
priority=20
startsecs=2
autorestart=true
stdout_logfile=/dev/null
redirect_stderr=true

[program:x11vnc]
command=/usr/bin/x11vnc -display :1 -rfbport 5900 -localhost -forever -shared -rfbauth /data/vnc/passwd -noxdamage -quiet -noipv6
environment=HOME="/home/konsole"
user=konsole
priority=30
startsecs=3
autorestart=true
stdout_logfile=/dev/null
redirect_stderr=true

[program:websockify]
command=/usr/bin/websockify 127.0.0.1:6081 127.0.0.1:5900
user=konsole
priority=40
autorestart=true
stdout_logfile=/dev/null
redirect_stderr=true

[program:app]
command=/usr/bin/python3 /opt/bmc-konsole/app/main.py
directory=/opt/bmc-konsole/app
environment=HOME="/home/konsole"
user=konsole
priority=50
stopsignal=TERM
stopwaitsecs=30
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:ttyd]
; Textkonsole (SOL) im Browser, hoechstens eine Sitzung wie beim BMC
command=/usr/bin/ttyd -i 127.0.0.1 -p 7681 -b /sol -m 1 -t rendererType=dom -t fontSize=16 -t "fontFamily=Consolas, Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace" -t 'theme={"background":"#000000","foreground":"#e5e7eb","cursor":"#60a5fa"}' -t titleFixed=SOL /opt/bmc-konsole/sol.sh
user=konsole
environment=HOME="/home/konsole"
priority=45
autorestart=true
stdout_logfile=/dev/null
redirect_stderr=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=60
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
