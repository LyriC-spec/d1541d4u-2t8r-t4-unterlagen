worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    client_max_body_size 64k;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    server {
        listen 8443 ssl;
        ssl_certificate     /data/tls/cert.pem;
        ssl_certificate_key /data/tls/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header X-Frame-Options SAMEORIGIN always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        # Sitzungspruefung fuer noVNC und den WebSocket (noVNC wird erst nach
        # der Anmeldung per import() geladen)
        location = /_auth {
            internal;
            proxy_pass http://127.0.0.1:5001/api/auth/check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
        }

        location /novnc/ {
            auth_request /_auth;
            alias /opt/novnc/;
        }

        location = /websockify {
            auth_request /_auth;
            proxy_pass http://127.0.0.1:6081;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /sol/ {
            auth_request /_auth;
            proxy_pass http://127.0.0.1:7681;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            proxy_pass http://127.0.0.1:5001;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 90s;
        }
    }
}
